<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B6FFF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#6C4DFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="15" fill="#0C0E14"/>
  <!-- UV 광선 -->
  <path d="M6 0 L40 64 L0 64 L0 8 Z" fill="url(#beam)" opacity=".5"/>
  <path d="M2 0 L30 64 L0 64 Z" fill="url(#beam)" opacity=".55"/>
  <!-- 거래 그래프: 어둠 속 노드들 -->
  <g stroke="#3A3F55" stroke-width="2" fill="none">
    <path d="M46 16 L24 40"/>
    <path d="M46 16 L50 44"/>
    <path d="M24 40 L50 44"/>
  </g>
  <circle cx="46" cy="16" r="5" fill="#2A2F45"/>
  <circle cx="50" cy="44" r="5" fill="#2A2F45"/>
  <!-- 빛에 드러난 노드 -->
  <circle cx="24" cy="40" r="6.5" fill="#CCFF00" filter="url(#glow)"/>
</svg>
